<style>
:root{--bg:#f8fafa;--card:#fff;--tx:#2d3748;--mut:#718096;--pri:#14b8a6;--pk:#fde2ee;--bl:#e0f4fd;--ln:#e2e8f0;--sh:0 2px 10px rgba(0,0,0,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181a;--card:#1a2528;--tx:#e6eef0;--mut:#9fb0b5;--pk:#3a2530;--bl:#173040;--ln:#2a393d;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181a;--card:#1a2528;--tx:#e6eef0;--mut:#9fb0b5;--pk:#3a2530;--bl:#173040;--ln:#2a393d;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:18px 16px 110px;max-width:640px;margin:auto}
h1{font-size:24px;margin:4px 0}h2{font-size:17px;margin:22px 0 8px}p{margin:4px 0}
.mut{color:var(--mut)}small{display:block;color:var(--mut);font-size:13px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.btn.red{background:#e5484d}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row>*{flex:1}.row>.btn.sm{flex:0 0 auto}
.card,.item{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--ln);padding:14px 16px;margin:8px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.item b{display:block;word-break:break-word}
.hero{background:var(--pri);color:#fff;border-radius:22px;padding:18px;margin:14px 0;display:flex;gap:18px}
.hero div{flex:1}.hero b{font-size:26px;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{border:0;border-radius:18px;padding:14px 6px;font:inherit;color:var(--tx);cursor:pointer;font-weight:600}
.tile span{display:block;font-size:24px}
input,select,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:inherit}
label{display:block;font-weight:600;font-size:14px;margin-top:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.star{background:none;border:0;font-size:22px;cursor:pointer;color:#f5b301;flex:0 0 auto}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:4px 0;cursor:pointer;border-radius:12px}
nav button span{display:block;font-size:21px}nav button.on{color:var(--pri);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.ov>.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#dlg{z-index:20;align-items:center}#dlg>.sheet{border-radius:22px;width:calc(100% - 40px);max-height:none}
.err{color:#e5484d;font-size:14px;min-height:18px}
.fc{perspective:900px;height:260px;margin:14px 0;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.ft,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:24px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--ln);overflow:auto;font-size:19px}
.bk{transform:rotateY(180deg);background:var(--pri);color:#fff;border:0}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:16px;padding:14px;font:inherit;cursor:pointer}
.opt.ok{border-color:#16a34a;background:rgba(22,163,74,.15)}.opt.bad{border-color:#e5484d;background:rgba(229,72,77,.15)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2d3748;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;display:none;max-width:86%}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
:root{--glass:rgba(255,255,255,.72)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(26,37,40,.72)}:root:not([data-theme="light"]) body{background:linear-gradient(135deg,#0f2a26 0%,#10181a 50%,#2a1822 100%) fixed}}
:root[data-theme="dark"]{--glass:rgba(26,37,40,.72)}:root[data-theme="dark"] body{background:linear-gradient(135deg,#0f2a26 0%,#10181a 50%,#2a1822 100%) fixed}
body{background:linear-gradient(135deg,#d6f3e6 0%,#f4f6f6 48%,#fbdfed 100%) fixed;min-height:100vh}
main{padding-bottom:130px}
.card,.item,.opt,input,select,textarea{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card,.item{border-radius:22px}.item{gap:12px}.item>div{flex:1;min-width:0}
nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;border:0;border-radius:32px;padding:8px 6px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(20,184,166,.22)}
.nb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
nav button.on .nb{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(20,184,166,.45)}
.fab{bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center}
.hd{display:flex;justify-content:space-between;align-items:center}
.logo{width:48px;height:48px;border-radius:16px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.sb{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--ln);border-radius:18px;padding:0 14px;margin:12px 0;color:var(--mut)}
.sb input{border:0;background:none;padding:13px 0;outline:0;backdrop-filter:none}
.stats{display:flex;gap:8px}.stats div{flex:1;background:var(--glass);border-radius:16px;padding:10px;text-align:center;border:1px solid var(--ln)}.stats b{display:block;font-size:20px;color:var(--pri)}.stats span{font-size:12px;color:var(--mut)}
.stack{display:flex;overflow-x:auto;padding:14px 8px 20px;scroll-snap-type:x mandatory}
.nc{flex:0 0 64%;min-height:160px;border-radius:24px;padding:16px;margin-right:-14px;scroll-snap-align:start;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.12);text-align:left;border:0;font:inherit;display:flex;flex-direction:column;gap:6px;color:#243b3a}
.nc:nth-child(odd){transform:rotate(-2deg)}.nc:nth-child(even){transform:rotate(2deg) translateY(6px)}.nc:last-child{margin-right:0}
.nc b{font-size:18px;line-height:1.25}.nc small{color:inherit;opacity:.7}
.nc .sn{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;opacity:.85;flex:1}
.act{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act button{border:0;border-radius:18px;padding:12px 4px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#243b3a}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pt{border:0;border-radius:18px;padding:14px;text-align:left;font:inherit;cursor:pointer;color:#243b3a}.pt b{display:block}.pt small{color:inherit;opacity:.7}
.sc{position:relative;border:0;border-radius:22px;height:132px;padding:14px;color:#fff;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(0,0,0,.18),inset 0 0 0 3px rgba(255,255,255,.14)}
.sc .t{font-family:"Bradley Hand","Chalkboard SE","Segoe Print","Comic Sans MS",cursive;font-size:21px;font-weight:700;line-height:1.1;letter-spacing:.4px}
.sc .f{position:absolute;right:12px;top:12px;opacity:.5;font:15px "Bradley Hand","Chalkboard SE","Segoe Print",cursive}
.sc .d{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:99px;font-size:12px;text-align:center;padding:5px}
.sc.add{background:var(--glass);color:var(--pri);border:2px dashed var(--pri);box-shadow:none;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600}
.bi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(20,184,166,.12);flex:0 0 auto}
:root{--fd:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;--fs:"Instrument Serif",Georgia,serif;--fb:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;--fc:"Gochi Hand","Bradley Hand","Segoe Print",cursive;--fm:"Space Mono",ui-monospace,Menlo,monospace}
body{font-family:var(--fb)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(24px);background:radial-gradient(circle at 18% 14%,rgba(20,184,166,.38),transparent 38%),radial-gradient(circle at 86% 26%,rgba(249,168,201,.6),transparent 36%),radial-gradient(circle at 58% 88%,rgba(125,211,252,.5),transparent 40%);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(5%,-4%) rotate(9deg) scale(1.12)}}
h1,h2{font-family:var(--fd);letter-spacing:-.035em}
h1{font-size:clamp(34px,10.5vw,50px);line-height:.96;font-weight:800;margin:6px 0 4px}
h2{font-size:23px;font-weight:800;margin:30px 0 10px}
h1 em,h2 em{font-family:var(--fs);font-style:italic;font-weight:400;color:var(--pri);font-size:1.14em;letter-spacing:-.01em}
.kick,small,.chip,.bento span{font-family:var(--fm)}
.kick{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:0}
small{font-size:11px}

.btn.ghost{background:var(--glass)}
input,select,textarea{min-height:48px;border-radius:15px;padding:13px 14px}
textarea{line-height:1.6}
label{margin-top:16px;font-size:12px;font-weight:700}
nav{
 left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 28px));
 bottom:calc(12px + env(safe-area-inset-bottom,0px));
 padding:8px 9px;border-radius:25px;
 background:var(--glass);border:1px solid var(--ln)!important;
 box-shadow:0 14px 38px rgba(24,75,67,.16)!important;
}
nav button{min-height:58px;border-radius:17px;transition:background .18s,color .18s}
nav button.on{background:rgba(24,173,157,.08)}
nav button.on .nb{background:var(--pri);color:white}
.fab{right:max(22px,calc((100vw - 760px)/2 + 22px));bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.ov{backdrop-filter:blur(8px)}
.ov>.sheet{max-width:680px;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px))}
.fc{height:300px}
.ft,.bk{font-size:clamp(23px,6vw,31px);padding:28px}
.opt{padding:16px;font-size:15px}
.bar{height:11px}
.empty{line-height:1.6}
#toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#dsheet2{width:min(86%,360px)}
.mi{padding:14px 12px;border-radius:15px}
@media(min-width:700px){
 main{padding-left:30px;padding-right:30px}
 .hd{min-height:190px}
 .hd>div{padding-top:82px}
 .bento .b1{min-height:210px}
 .nc{flex-basis:54%}
}
@media(max-width:420px){
 main{padding-left:17px;padding-right:17px}
 .hd>div{padding-top:76px}
 img.wm{width:116px}
 .mega{font-size:42px}
 .bento{gap:8px}
 .bento>div{padding:13px;border-radius:20px}
 .bento .b1{min-height:160px}
 .bento .b1 b{font-size:78px}
 .bento b{font-size:42px}
 .act{grid-template-columns:repeat(2,1fr)}
 nav{width:calc(100% - 20px);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
 nav button{min-height:54px}
}
@media(hover:hover){
 .card,.item,.sc,.nc,.pt,.act button{transition:transform .2s ease,box-shadow .2s ease}
 .item:hover,.sc:hover,.nc:hover,.pt:hover,.act button:hover{transform:translateY(-2px)!important;box-shadow:0 14px 28px rgba(36,59,58,.12)!important}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
 outline:3px solid rgba(24,173,157,.35);outline-offset:3px
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* Simplearn Hype carousel */
.hype-section{margin:25px 0 28px;min-width:0}
.hype-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hype-head h2{margin:0;font-size:clamp(19px,4vw,23px);letter-spacing:-.55px;line-height:1.2}
.hype-head p{margin:5px 0 0;font-size:13px}
.hype-spark{font-size:26px;color:#b34df1;filter:drop-shadow(0 3px 8px #d8b8ff)}
.hype-wrap{position:relative}
.hype-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;border-radius:20px}
.hype-track::-webkit-scrollbar{display:none}
.hype-slide{flex:0 0 100%;scroll-snap-align:start;overflow:hidden;border-radius:19px;background:#f5f2ff;box-shadow:0 7px 22px rgba(70,80,130,.11);border:1px solid rgba(175,190,240,.35);aspect-ratio:8/3}
.hype-slide img{display:block;width:100%;height:100%;object-fit:cover}
.hype-arrow{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#53617e;font-size:25px;line-height:1;box-shadow:0 3px 12px #29375b24;cursor:pointer;display:grid;place-items:center}
.hype-arrow.prev{left:9px}.hype-arrow.next{right:9px}
.hype-dots{display:flex;justify-content:center;align-items:center;gap:7px;padding-top:11px}
.hype-dot{width:7px;height:7px;padding:0;border:0;border-radius:99px;background:#c9cde0;cursor:pointer;transition:all .2s}
.hype-dot.active{width:22px;background:linear-gradient(90deg,#13d7d1,#b84cf2)}
@media(max-width:560px){
 .hype-section{margin:22px 0 25px}
 .hype-head h2{font-size:18px}
 .hype-slide{aspect-ratio:8/3;border-radius:15px}
 .hype-arrow{width:29px;height:29px;font-size:22px}
 .hype-arrow.prev{left:6px}.hype-arrow.next{right:6px}
}

</style><style>

/* ===== Simplearn v0.4 — learning progress dashboard ===== */
.pulse{margin:18px 0 22px;padding:18px!important;border-radius:24px!important;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--pri) 7%,var(--card)))!important;box-shadow:0 12px 32px rgba(19,105,97,.09)!important}
.pulse-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pulse h2{margin:4px 0 0;font-size:19px}.eyebrow{font-size:9px;font-weight:900;letter-spacing:1.6px;color:var(--pri)}
.streak{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:5px;padding:7px 11px;border-radius:15px;background:rgba(255,173,74,.13);color:#b86a12}
.streak span{grid-row:span 2;font-size:23px}.streak b{font-size:21px;line-height:1}.streak small{font-size:9px;font-weight:800}
.week-bars{display:flex;align-items:end;justify-content:space-around;gap:10px;height:91px;margin:18px 3px 10px}
.week-day{display:flex;flex:1;max-width:42px;flex-direction:column;align-items:center;gap:7px;height:100%}
.week-day .track{height:68px;width:100%;display:flex;align-items:end;padding:3px;border-radius:10px;background:var(--bg);overflow:hidden}
.week-day .track i{display:block;width:100%;min-height:5px;border-radius:7px;background:var(--ln);transition:height .3s}
.week-day .track i.filled{background:linear-gradient(180deg,#63d7c0,var(--pri));box-shadow:0 3px 10px rgba(20,184,166,.2)}
.week-day small{font-size:10px;color:var(--mut);font-weight:700}.week-day small.is-today{color:var(--pri);font-weight:950}
.goal-line{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;margin-top:4px}.goal-line b{color:var(--pri);font-variant-numeric:tabular-nums}
.goal-track{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:8px}.goal-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#72d9c3,var(--pri));transition:width .35s}
.pulse-note{font-size:10px!important;color:var(--mut)!important;margin:10px 0 0!important;line-height:1.5}
@media(min-width:700px){.pulse{max-width:680px}}
@media(prefers-reduced-motion:reduce){.week-day .track i,.goal-track i{transition:none}}

</style>

/* ---------- AI Note Maker ---------- */
let aiPhotoData='', aiPhotoName='';
function aiNoteMakerH(){
 const opts=subs().map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
 return `<h1>AI <em>Note Maker</em></h1>
 <p class="mut">Foto papan tulis atau materi belajar. AI akan menyusunnya menjadi catatan rapi dan menyimpannya ke Pustaka Simplearn.</p>
 ${!currentUser?`<div class="card" style="border:1px solid var(--ln);margin-bottom:14px"><b>Login diperlukan</b><p class="mut">Masuk dengan Google agar catatan otomatis tersimpan ke akun Simplearn kamu.</p><button class="btn" onclick="signInGoogle()">Login dengan Google</button></div>`:''}
 <div class="card" style="padding:16px">
  <label>Foto materi</label>
  <input id="ai_photo" type="file" accept="image/*" capture="environment" onchange="aiPhotoChanged(this)" style="width:100%;margin:8px 0">
  <div id="ai_preview" class="mut" style="font-size:13px">Pilih foto papan tulis, slide, buku, atau catatan tulisan tangan.</div>
  <label style="margin-top:14px">Simpan ke mata pelajaran</label>
  <select id="ai_subject" style="width:100%">${opts}</select>
  <label style="margin-top:12px">Bab / topik (opsional)</label>
  <input id="ai_chapter" placeholder="Contoh: Sistem pencernaan">
  <label style="margin-top:12px">Instruksi tambahan (opsional)</label>
  <textarea id="ai_hint" rows="2" placeholder="Contoh: Jelaskan istilah yang sulit dan pertahankan rumus dari papan tulis."></textarea>
  <button class="btn" id="ai_make" style="width:100%;margin-top:14px" onclick="aiMakeNote()" ${!currentUser?'disabled':''}>✨ Buat & simpan catatan</button>
  <div id="ai_status" class="mut" style="font-size:13px;margin-top:10px"></div>
 </div>
 <div class="card" style="margin-top:14px"><b>Format catatan otomatis</b><p class="mut" style="margin-bottom:0">Judul · Subjudul · Poin penting · Penjelasan · Contoh. Catatan tersimpan di Pustaka dan bisa diedit kapan saja.</p></div>`;
}
function aiPhotoChanged(input){
 const f=input.files&&input.files[0]; if(!f)return;
 if(!f.type.startsWith('image/')){toast('Pilih file gambar.');input.value='';return}
 if(f.size>12*1024*1024){toast('Ukuran foto maksimal 12 MB.');input.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{aiPhotoData=reader.result;aiPhotoName=f.name;const p=$('#ai_preview');if(p)p.innerHTML=`<img src="${aiPhotoData}" alt="Preview materi" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px"><div class="mut" style="margin-top:6px">${esc(f.name)}</div>`};
 reader.onerror=()=>toast('Foto gagal dibaca. Coba pilih ulang.');
 reader.readAsDataURL(f);
}
async function aiMakeNote(){
 if(!currentUser){toast('Login Google dulu untuk menyimpan catatan.');return}
 if(!aiPhotoData){toast('Pilih foto materi terlebih dahulu.');return}
 const btn=$('#ai_make'),status=$('#ai_status');
 btn.disabled=true;btn.textContent='⏳ AI sedang membaca materi...';
 if(status)status.textContent='Sedang mengenali tulisan dan menyusun catatan. Jangan tutup halaman.';
 try{
  const token=await currentUser.getIdToken();
  const resp=await fetch('/api/ai-note',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({image:aiPhotoData,subject:$('#ai_subject').value,chapter:$('#ai_chapter').value.trim(),hint:$('#ai_hint').value.trim()})});
  const payload=await resp.json().catch(()=>({}));
  if(!resp.ok)throw new Error(payload.error||`Server AI gagal (${resp.status})`);
  const note=payload.note||{};
  if(!note.title||!note.content)throw new Error('AI belum menghasilkan catatan yang valid. Coba foto yang lebih jelas.');
  const entry={id:uid(),title:String(note.title).slice(0,140),subject:$('#ai_subject').value,chapter:$('#ai_chapter').value.trim(),content:String(note.content),fav:false,at:Date.now(),source:'ai-photo'};
  S.notes.push(entry);save();aiPhotoData='';aiPhotoName='';
  toast('Catatan AI berhasil disimpan ke Pustaka!');
  render();
  setTimeout(()=>{const created=S.notes.find(n=>n.id===entry.id);if(created)editNote(created.id)},100);
 }catch(e){console.error('AI Note Maker:',e);if(status)status.textContent=e.message||'Gagal membuat catatan. Coba lagi.';toast(e.message||'Gagal membuat catatan.')}
 finally{const b=$('#ai_make');if(b){b.disabled=!currentUser;b.textContent='✨ Buat & simpan catatan'}}
}

function hypeH(){
 return `<section class="hype-section">
  <div class="hype-head"><div><h2>Ceki Ceki Dot Simplearn Guys!</h2><p class="mut">Ada yang baru dan seru buat kamu ✨</p></div><span class="hype-spark">✦</span></div>
  <div class="hype-wrap">
   <button class="hype-arrow prev" aria-label="Banner sebelumnya" onclick="hypeMove(-1)">‹</button>
   <div class="hype-track" id="hypeTrack">${HYPE_BANNERS.map((src,i)=>`<div class="hype-slide"><img src="${src}" alt="Banner promosi Simplearn ${i+1}" loading="${i===0?'eager':'lazy'}"></div>`).join('')}</div>
   <button class="hype-arrow next" aria-label="Banner berikutnya" onclick="hypeMove(1)">›</button>
  </div>
  <div class="hype-dots">${HYPE_BANNERS.map((_,i)=>`<button class="hype-dot ${i===0?'active':''}" aria-label="Lihat banner ${i+1}" onclick="hypeGo(${i})"></button>`).join('')}</div>
 </section>`;
}
function hypeGo(i){
 const track=document.getElementById('hypeTrack'); if(!track)return;
 const slides=track.querySelectorAll('.hype-slide'); const n=Math.max(0,Math.min(i,slides.length-1));
 slides[n].scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});
 document.querySelectorAll('.hype-dot').forEach((d,j)=>d.classList.toggle('active',j===n));
}
function hypeMove(dir){
 const track=document.getElementById('hypeTrack'); if(!track)return;
 const slides=[...track.querySelectorAll('.hype-slide')];
 const current=Math.round(track.scrollLeft/(slides[0]?.offsetWidth||1));
 hypeGo((current+dir+slides.length)%slides.length);
}
function homeH(){
 const r=byDate(S.notes).slice(0,5);
 return `<h1>Halo, Pelajar! 👋</h1><p class="mut">Learn Smarter, Not Harder.</p>
 <div class="hero"><div><b>${S.notes.length}</b>catatan</div><div><b>${S.notes.filter(n=>n.fav).length}</b>favorit</div><div><b>${S.cards.length}</b>kartu</div></div>
 <button class="btn" style="width:100%" onclick="editNote()">+ Buat catatan baru</button>
 <div class="tiles"><button class="tile" style="background:var(--pk)" onclick="go('cards')"><span>🃏</span>Flashcards</button><button class="tile" style="background:var(--bl)" onclick="go('cards');quizSetup()"><span>📝</span>Kuis</button><button class="tile" style="background:var(--card);border:1px solid var(--ln)" onclick="go('tutor')"><span>💡</span>AI Tutor</button></div>
 ${hypeH()}
 <h2>Terakhir diubah</h2>${r.length?r.map(item).join(''):'<div class="card empty">Belum ada catatan. Mulai dengan catatan pertamamu!</div>'}`}
function libH(){
 return `<h1>Pustaka Catatan</h1><input id="qs" placeholder="Cari catatan..." value="${esc(q)}" oninput="q=this.value;renderList()">
 <div class="chips"><button class="chip ${fFav?'on':''}" onclick="fFav=!fFav;render()">★ Favorit</button><button class="chip ${!fSub?'on':''}" onclick="fSub='';render()">Semua</button>${subs().map(s=>`<button class="chip ${fSub===s?'on':''}" onclick="fSub=this.dataset.s;render()" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <div id="list"></div><button class="btn fab" onclick="editNote()">+ Catatan</button>`}
function renderList(){
 const k=q.toLowerCase();
 const l=byDate(S.notes).filter(n=>(!fSub||n.subject===fSub)&&(!fFav||n.fav)&&(!k||(n.title+n.content+n.chapter).toLowerCase().includes(k)));
 $('#list').innerHTML=l.length?l.map(item).join(''):`<div class="empty">${S.notes.length?'Tidak ada catatan yang cocok.':'Pustaka masih kosong. Tekan + Catatan untuk mulai.'}</div>`}
function fav(id){const n=S.notes.find(x=>x.id===id);if(!n)return;n.fav=!n.fav;save();tab==='lib'?renderList():render()}
function subOpts(sel){return subs().map(s=>`<option ${s===sel?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}
function editNote(id){
 const n=S.notes.find(x=>x.id===id)||{title:'',subject:fSub||DEF[0],chapter:'',content:''};
 openM(`<h2 style="margin-top:0">${id?'Edit catatan':'Catatan baru'}</h2>
 <label>Judul</label><input id="f_t" value="${esc(n.title)}"><div class="err" id="f_e"></div>
 <label>Mata pelajaran</label><div class="row"><select id="f_s">${subOpts(n.subject)}</select><button class="btn ghost sm" aria-label="Tambah mapel" onclick="$('#nsrow').style.display='flex'">+</button></div>
 <div class="row" id="nsrow" style="display:none"><input id="f_ns" placeholder="Nama mapel baru"><button class="btn sm" onclick="addSub()">Tambah</button></div>
 <label>Bab / topik (opsional)</label><input id="f_c" value="${esc(n.chapter)}">
 <label>Isi catatan</label><textarea id="f_b" rows="9">${esc(n.content)}</textarea>
 <button class="btn ghost" style="width:100%;margin-top:12px" onclick="noteToCards()">🃏 Jadikan flashcard</button><small style="margin-bottom:6px">Tulis baris berformat Istilah: penjelasan. Tiap baris jadi satu kartu (pemisahan otomatis sederhana, bukan AI).</small>
 <div class="row"><button class="btn ghost" onclick="closeM()">Batal</button><button class="btn" onclick="saveNote('${id||''}')">Simpan</button></div>
 ${id?`<button class="btn red" style="width:100%" onclick="delNote('${id}')">Hapus catatan</button>`:''}`)}
function addSub(){
 const v=$('#f_ns').value.trim();
 if(!v||subs().some(s=>s.toLowerCase()===v.toLowerCase())){toast('Nama kosong atau sudah ada');return}

 if(!n){n={id:uid(),fav:false};S.notes.push(n)}
 Object.assign(n,{title:t,subject:$('#f_s').value,chapter:$('#f_c').value.trim(),content:$('#f_b').value,at:Date.now()});

function noteToCards(){
 const sub=$('#f_s').value,lines=$('#f_b').value.split('\n');
 let add=0,dup=0;
 for(const ln of lines){
  const m=ln.match(/^\s*(?:[-•*]\s*)?(.{2,80}?)\s*(?::|—|–|\s-\s)\s*(.{3,})$/);
  if(!m)continue;
  const f=m[1].trim(),b=m[2].trim();
  if(S.cards.some(c=>c.f===f&&c.b===b)){dup++;continue}
  S.cards.push({id:uid(),f,b,sub});add++}
 if(add)save();
 toast(add?`${add} kartu dibuat${dup?`, ${dup} sudah ada`:''}`:dup?'Semua kartu sudah ada':'Tidak ada baris berformat Istilah: penjelasan')}
